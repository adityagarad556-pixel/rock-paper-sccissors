<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rock-paper-scissor</title>

    <link rel="stylesheet" href="css/12_rps.css">
</head>
<body>
    <div class="game-container">
    <p class="header">rock paper scissors</p>

    <!-- onclick="
    playgame('rock'); -->
    <button 
     class="move-button js-rock-button">

        <img src="images/rock-emoji.png" class="rock-button">
        
    </button>

    <!-- onclick="
    playgame('paper');
    "  -->
    <button
    
    class="move-button js-paper-button"
    >
        <img src="images/paper-emoji.png" class="paper-icon">
    </button>

    <button 
    class="move-button js-scissors-button">
        <img src="images/scissors-emoji.png" class="scissor-icon">
    </button>
    
    <p class="js-result result" > you win</p>
    <p class="js-moves">
    </p>
    <p class="js-socre score"></p>

    <button onclick="
    score.wins = 0;
    score.losses = 0;
    score.ties = 0;
    localStorage.removeItem('score');
    updatesocre();
    " class="reset-button">reset score</button>
    <button class="auto-play-button"
     onclick="
     autoplay();
   
    ">Auto play</button>
     </div>
    <script src="javascript/12_rps.js"> </script>
</body>
</html>
